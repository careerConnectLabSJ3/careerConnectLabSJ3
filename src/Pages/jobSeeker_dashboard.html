<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CareerConnect</title>
    <link rel="stylesheet" href="/css/jobSeeker.css">
</head>
<body>
    <!-- Simple Top Navigation -->
    <header class="dashboard-header">
        <h2>CareerConnect</h2>
        <nav>
            <span class="welcome-message">Welcome Back!</span>
            <a href="/profile" class="profile-link">
                <img src="./img/default-pfp.png" alt="Default Image Profile" class="dashboard-profile"/>
            </a>
            <a href="/" class="logout-link">Log Out</a>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="dashboard-main">
        <h1 class="dashboard-title">Job Seeker Dashboard</h1>

        <!-- Stats Overview Cards -->
        <section class="stats-section">
            <div class="stat-card stat-applied">
                <h3>Total Applied</h3>
                <p class="stat-number">3</p>
            </div>
            <div class="stat-card stat-interviews">
                <h3>Interviews</h3>
                <p class="stat-number">1</p>
            </div>
            <div class="stat-card stat-offers">
                <h3>Offers</h3>
                <p class="stat-number">0</p>
            </div>
        </section>

        <!-- Application List Table -->
        <section class="applications-section">
            <h2>Recent Applications</h2>
            <table class="applications-table">
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Position</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="company-name">Google</td>
                        <td>Frontend Developer</td>
                        <td><span class="status-badge status-interviewing">Interviewing</span></td>
                    </tr>
                    <tr>
                        <td class="company-name">Amazon</td>
                        <td>Software Engineer Intern</td>
                        <td><span class="status-badge status-applied">Applied</span></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <script>
        fetch('api/current-user')
            .then(response => response.json())
            .then(user => {
                if (user.name) {
                    const welcomeMessage = document.getElementById('welcome-message');
                    welcomeMessage.innerText = `Welcome back, ${user.name}!`;
                }
            })
        .catch(err => console.error("could not fetch user session:", err));
    </script>
</body>
</html>
