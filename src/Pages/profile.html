<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - CareerConnect</title>
  <link rel="stylesheet" href="/css/jobSeeker.css">
  <script src="/js/profile.js"></script>
</head>
<body>
  <header class="dashboard-header">
      <a href="/dashboard" class="nav-logo">Career<span>Connect</span></a>
      <nav class="dashboard-navbar">
          <a href="/profile" class="profile-link">
              <img src="/css/img/default-pfp.png" alt="Default Image Profile" class="dashboard-profile"/>
          </a>
      </nav>
  </header>
  <main class="profile-main">
    <button>
      <a href="/" class="logout-link">Log Out</a>
    </button>
    <img src="/css/img/default-pfp.png" alt="Default Image Profile" id="profile-img"/>
    <section class="profile-main-info">
      <a href="" class="right-align"><img src="/css/img/edit-pen.svg" class="icon"/></a>
      <section>
        <p>Name</p>
        <p id="profile-name"></p>
      </section>
      <section>
        <p>Education</p>
        <p id="profile-education"></p>
      </section>
      <section>
        <p>Work Experience</p>
        <p id="profile-work-exp"></p>
      </section>
      <section>
        <p>Skills</p>
        <p id="profile-skills"></p>
      </section>
    </section>

  </main>
</body>
</html>
