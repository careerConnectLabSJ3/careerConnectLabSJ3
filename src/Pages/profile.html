<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - CareerConnect</title>
  <link rel="stylesheet" href="/css/jobSeeker.css">
  <link rel="stylesheet" href="/css/header.css">
  <script src="/js/profile.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav aria-label="Dashboard navigation">
      <div class="site-nav-container">
        <a href="/dashboard" class="site-logo">Career<span>Connect</span></a>

        <div class="site-nav-links">
          <a href="/profile" class="profile-link">
            <img src="/css/img/default-pfp.png" alt="Default Image Profile" class="dashboard-profile"/>
          </a>
          <a href="/logout">Log Out</a>
        </div>
      </div>
    </nav>
  </header>
  <form action="/profile" method="POST" id="profile-form">
    <main class="profile-main">
      <img src="/css/img/default-pfp.png" alt="Default Image Profile" id="profile-img"/>
      <section class="profile-main-info">
        <span class="right-align">
          <button type="button" id="profile-edit-icon"><img src="/css/img/edit-pen.svg" class="icon"/></button>
        </span>
        <section>
          <label for="profile-name">Name</label>
          <input type="text" id="profile-name" name="name" value="" disabled/>
        </section>
        <section>
          <label for="profile-education">Education</label>
          <input type="text" id="profile-education" name="education" value="" disabled/>
        </section>
        <section>
          <label for="profile-work-exp">Work Experience</label>
          <input type="text" id="profile-work-exp" name="workExp" value="" disabled/>
        </section>
        <section>
          <label for="profile-skills">Skills</label>
          <input type="text" id="profile-skills" name="skills" value="" disabled/>
        </section>
    </section>
    <section id="buttons-profile-edit" class="hidden">
      <button type="submit" id="profile-save-btn">Save</button>
      <button type="button" id="profile-cancel-btn">Cancel</button>
    </section>
  </main>
  </form>
</body>
</html>
