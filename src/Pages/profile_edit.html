<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - CareerConnect</title>
  <link rel="stylesheet" href="/css/jobSeeker.css">
  <script src="/js/profile.js"></script>
</head>
<body>
  <header class="dashboard-header">
      <a href="/dashboard" class="nav-logo">Career<span>Connect</span></a>
      <nav class="dashboard-navbar">
          <a href="/profile" class="profile-link">
              <img src="/css/img/default-pfp.png" alt="Default Image Profile" class="dashboard-profile"/>
          </a>
      </nav>
  </header>
  <form action="/profile-edit" method="POST">
    <main class="profile-main">
      <img src="/css/img/default-pfp.png" alt="Default Image Profile" id="profile-img"/>
      <section class="profile-main-info">
        <section>
          <label for="profile-name">Name</label>
          <input type="text" id="profile-name" name="name" value=""/>
        </section>
        <section>
          <label for="profile-education">Education</label>
          <input type="text" id="profile-education" name="education" value=""/>
        </section>
        <section>
          <label for="profile-work-exp">Work Experience</label>
          <input type="text" id="profile-work-exp" name="workExp" value=""/>
        </section>
        <section>
          <label for="profile-skills">Skills</label>
          <input type="text" id="profile-skills" name="skills" value=""/>
        </section>
    </section>
    <section class="buttons-profile-edit">
      <button type="submit">Save</button>
      <button><a href="/profile">Cancel</a></button>
    </section>
  </main>
  </form>
</body>
</html>
