name: CI Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install root dependencies
      run: npm ci

    - name: Run eslint
      run: npm run lint

  unit-tests:
    name: Jest unit tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          src/server/package-lock.json

    - name: Install root test dependencies
      run: npm ci

    - name: Install server dependencies
      run: npm ci --prefix src/server

    - name: Run unit tests with Jest
      run: npm run test:unit

  acceptance-tests:
    name: Vitest acceptance tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: src/client/package-lock.json

    - name: Install client dependencies
      run: npm ci --prefix src/client

    - name: Run acceptance tests with Vitest
      run: npm run test:acceptance
