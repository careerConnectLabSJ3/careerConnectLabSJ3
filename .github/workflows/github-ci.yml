name: CI Pipeline
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

  jobs:
    lint:
      runs-on: ubuntu-latest
      strategy:
        matrix:
          node-version: [18.x, 20.x, 22.x]
      steps:
      - name: Run eslint
        run: npm run lint