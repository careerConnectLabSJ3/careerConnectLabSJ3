name: CI Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Run eslint
        run: npm run lint

      - name: Install server dependencies
        run: npm --prefix src/server install

      - name: Run server tests
        run: npm --prefix src/server test
